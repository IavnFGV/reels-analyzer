[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reels-analyzer"
version = "0.1.0"
description = "TikTok/Reels research pipeline with optional video, transcription, and LLM analysis stages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "typer>=0.12,<1",
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
video = [
  "opencv-python-headless>=4.10,<5",
  "scenedetect>=0.6.3,<1",
]
transcription = [
  "faster-whisper>=1.1,<2",
]
llm = [
  "requests>=2.32,<3",
]
reporting = [
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "ipywidgets>=8,<9",
  "jupyterlab>=4,<5",
  "nbformat>=5.10,<6",
]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.11,<0.12",
]

[project.scripts]
reels-analyzer = "reels_analyzer.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["reels_analyzer*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
